name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: Package (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      # Both libraries build on macOS: CNCTUI's screen is iOS only, and what is left of it here — the
      # theme, the words, text direction, the fixture — is tested here too.
      - run: swift build
      - run: swift test

  ios:
    name: iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # The first available iPhone, by id. Simulator names change with every runner image, and a
      # name that stopped existing fails the job for a reason that has nothing to do with the SDK.
      - name: Pick a simulator
        id: sim
        run: |
          udid="$(xcrun simctl list devices available --json | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, items in devices.items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')))
          ")"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$udid"
      - name: Schemes
        run: xcodebuild -list
      # Every test target, CNCTUI's included, on the simulator. The screenshot test renders the
      # fixture conversation with the real screen and writes the PNGs where this says.
      - name: Test on the simulator, and render the screenshots
        env:
          TEST_RUNNER_CNCT_SCREENSHOTS_DIR: ${{ github.workspace }}/screenshots
        run: |
          mkdir -p "$TEST_RUNNER_CNCT_SCREENSHOTS_DIR"
          xcodebuild test -scheme CNCT-Package -destination "id=${{ steps.sim.outputs.udid }}"
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/*.png
          if-no-files-found: error

  example:
    name: Example app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # A build, not a run: it proves the example still compiles against the package as it is on
      # this branch, which is the whole promise an example makes. Unsigned — nothing is installed.
      - name: Build Examples/ChatDemo for the simulator
        run: >
          xcodebuild build
          -project Examples/ChatDemo/ChatDemo.xcodeproj
          -scheme ChatDemo
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
